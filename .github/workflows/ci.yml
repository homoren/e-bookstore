name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (compile + test)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: ebookstore
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_PASSWORD: '123456'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile
        working-directory: ebookstore-backend
        run: |
          chmod +x ./mvnw
          ./mvnw -q compile

      # contextLoads 会连接 MySQL 并执行 Flyway 迁移,验证完整启动链路
      - name: Test
        working-directory: ebookstore-backend
        run: ./mvnw -q test

  frontend:
    name: Frontend (type-check + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ebookstore-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ebookstore-frontend
        run: npm ci

      - name: Type check
        working-directory: ebookstore-frontend
        run: npm run type-check

      - name: Lint
        working-directory: ebookstore-frontend
        run: npx oxlint .

      - name: Unit tests
        working-directory: ebookstore-frontend
        run: npm run test

      - name: Build
        working-directory: ebookstore-frontend
        run: npm run build
