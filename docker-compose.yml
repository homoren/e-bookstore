services:
  mysql:
    image: mysql:8.0
    container_name: ebookstore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ebookstore
    volumes:
      - mysql-data:/var/lib/mysql
    # 不映射宿主机端口:后端通过 compose 服务名 mysql:3306 访问,
    # 避免宿主机 3306 被占用冲突(如需本机调试数据库再自行加映射)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ebookstore-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./ebookstore-backend
    container_name: ebookstore-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 用 compose 服务名,不要用 localhost/IP
      DB_URL: jdbc:mysql://mysql:3306/ebookstore?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
      DB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-my-ebookstore-secret-key-2024-very-long-key}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./ebookstore-frontend
    container_name: ebookstore-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 宿主 80 若被占用(如已有 nginx),改 .env 里的 FRONTEND_PORT
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql-data:
  redis-data:
