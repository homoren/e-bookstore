server:
  port: 8080

spring:
  datasource:
    # 可用环境变量 DB_URL / DB_PASSWORD 覆盖(容器部署时指向 compose 内的 mysql 服务)
    url: ${DB_URL:jdbc:mysql://localhost:3306/ebookstore?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Flyway 数据库迁移:现有库无历史表时按 0 版本基线,再从 V1 开始执行(迁移 SQL 均幂等)
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  # Redis 缓存
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
  cache:
    type: redis

# JWT 配置
jwt:
  # 至少 32 位,可用环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:my-ebookstore-secret-key-2024-very-long-key}
  # 有效期(毫秒),默认 7 天
  expiration: 604800000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.ebookstore.entity
  global-config:
    db-config:
      # 主键自增
      id-type: auto

logging:
  level:
    com.ebookstore.mapper: debug