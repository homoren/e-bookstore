server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ebookstore?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    # 可用环境变量 DB_PASSWORD 覆盖
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

# JWT 配置
jwt:
  # 至少 32 位
  secret: my-ebookstore-secret-key-2024-very-long-key
  # 有效期(毫秒),默认 7 天
  expiration: 604800000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.ebookstore.entity

logging:
  level:
    com.ebookstore.mapper: debug